<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Llamadas - Paquetería</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            padding: 24px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 12px;
            color: #1a252f;
        }

        /* Selector de Fecha Histórica */
        .date-picker-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #e9ecef;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .date-picker-section label {
            font-size: 0.9rem;
            font-weight: 600;
            color: #495057;
        }

        .date-input {
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #ced4da;
            font-size: 0.95rem;
            font-weight: bold;
            outline: none;
        }

        /* Selector de Chip / Línea */
        .chip-selection {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .chip-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #0d6efd;
            background: #ffffff;
            color: #0d6efd;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .chip-btn.active {
            background: #0d6efd;
            color: #ffffff;
        }

        /* Formulario de Entrada Superior */
        .input-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .phone-input {
            width: 100%;
            padding: 12px;
            font-size: 1.2rem;
            text-align: center;
            letter-spacing: 4px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        .phone-input:focus {
            border-color: #3498db;
        }

        /* Botones de Estado */
        .status-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 24px;
        }

        .btn-status {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .btn-status:active {
            transform: scale(0.98);
        }

        .btn-status:hover {
            opacity: 0.9;
        }

        /* Colores Específicos */
        .bg-verde { background-color: #2ecc71; color: white; }
        .bg-amarillo { background-color: #f1c40f; color: #333; }
        .bg-rojo { background-color: #e74c3c; color: white; }

        /* Sección del Listado y Buscador */
        .list-section {
            border-top: 2px solid var(--border-color);
            padding-top: 16px;
        }

        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .list-header h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .counter {
            font-size: 0.85rem;
            background: #e9ecef;
            padding: 4px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* Campo de Búsqueda */
        .search-box {
            width: 100%;
            padding: 10px;
            font-size: 0.95rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 12px;
            box-sizing: border-box;
            outline: none;
        }

        .search-box:focus {
            border-color: #3498db;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 350px;
            overflow-y: auto;
        }

        .log-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            margin-bottom: 8px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chip-tag {
            background: rgba(0, 0, 0, 0.15);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .log-time {
            font-size: 0.75rem;
            opacity: 0.85;
            font-weight: normal;
        }

        .btn-edit {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-left: 6px;
            transition: background 0.2s;
        }

        .btn-edit:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .empty-msg {
            text-align: center;
            color: #888;
            font-style: italic;
            padding: 20px;
        }

        /* Ventana Modal de Edición */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .modal-content h3 {
            margin-top: 0;
            text-align: center;
            font-size: 1.1rem;
        }

        .modal-buttons {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
            margin-top: 16px;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
            cursor: pointer;
        }

        .btn-cancel {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            cursor: pointer;
        }
    </style>

    <!-- Carga de SDKs de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h2>Registro de Llamadas</h2>

    <!-- Selector para navegar en el historial por fechas -->
    <div class="date-picker-section">
        <label for="dateSelect">📅 Consultar Fecha:</label>
        <input type="date" id="dateSelect" class="date-input" onchange="cambiarFechaConsulta()">
    </div>

    <!-- Seleccionar con cuál Chip se realiza la llamada -->
    <label>📱 Selecciona el Chip utilizado:</label>
    <div class="chip-selection">
        <button type="button" class="chip-btn active" id="chip1" onclick="seleccionarChip('Chip 1')">Chip 1</button>
        <button type="button" class="chip-btn" id="chip2" onclick="seleccionarChip('Chip 2')">Chip 2</button>
        <button type="button" class="chip-btn" id="chip3" onclick="seleccionarChip('Chip 3')">Chip 3</button>
    </div>

    <!-- Renglón para ingresar los 4 dígitos (Arriba) -->
    <div class="input-section">
        <label for="digits">Últimos 4 dígitos del teléfono:</label>
        <input type="text" id="digits" class="phone-input" maxlength="4" placeholder="1234" inputmode="numeric" autofocus>
    </div>

    <!-- Opciones de Estado (Abajo) -->
    <div class="status-buttons">
        <button class="btn-status bg-verde" onclick="registrar('Contestó', 'bg-verde')">Contestó</button>
        <button class="btn-status bg-amarillo" onclick="registrar('No contestó', 'bg-amarillo')">No contestó</button>
        <button class="btn-status bg-rojo" onclick="registrar('Número incorrecto', 'bg-rojo')">Número incorrecto</button>
        <button class="btn-status bg-rojo" onclick="registrar('Buzón directo', 'bg-rojo')">Buzón directo</button>
        <button class="btn-status bg-rojo" onclick="registrar('Inaccesible', 'bg-rojo')">Inaccesible</button>
        <button class="btn-status bg-rojo" onclick="registrar('Número no existe', 'bg-rojo')">Número no existe</button>
    </div>

    <!-- Historial de Registro -->
    <div class="list-section">
        <div class="list-header">
            <h3>Listado de Llamadas</h3>
            <span id="counter" class="counter">Total: 0</span>
        </div>

        <!-- Buscador -->
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 Buscar por 4 dígitos, chip o estado..." oninput="filtrarLlamadas()">

        <ul id="logList">
            <li class="empty-msg" id="emptyMsg">Cargando registros...</li>
        </ul>
    </div>
</div>

<!-- Modal para Cambiar Estado o Eliminar -->
<div class="modal-overlay" id="editModal">
    <div class="modal-content">
        <h3 id="modalTitle">Cambiar estado del número</h3>
        <div class="modal-buttons">
            <button class="btn-status bg-verde" onclick="confirmarEdicion('Contestó', 'bg-verde')">Contestó</button>
            <button class="btn-status bg-amarillo" onclick="confirmarEdicion('No contestó', 'bg-amarillo')">No contestó</button>
            <button class="btn-status bg-rojo" onclick="confirmarEdicion('Número incorrecto', 'bg-rojo')">Número incorrecto</button>
            <button class="btn-status bg-rojo" onclick="confirmarEdicion('Buzón directo', 'bg-rojo')">Buzón directo</button>
            <button class="btn-status bg-rojo" onclick="confirmarEdicion('Inaccesible', 'bg-rojo')">Inaccesible</button>
            <button class="btn-status bg-rojo" onclick="confirmarEdicion('Número no existe', 'bg-rojo')">Número no existe</button>
        </div>
        <button class="btn-delete" onclick="eliminarRegistro()">🗑️ Eliminar Registro</button>
        <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAhFORcZkm0vRUywEdbL2d_cJCHdH2bn8Q",
        authDomain: "llamadas-paqueteria.firebaseapp.com",
        databaseURL: "https://llamadas-paqueteria-default-rtdb.firebaseio.com",
        projectId: "llamadas-paqueteria",
        storageBucket: "llamadas-paqueteria.firebasestorage.app",
        messagingSenderId: "549464406395",
        appId: "1:549464406395:web:d001d5854c1c80dc9e65de"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let callsLog = [];
    let currentListener = null;
    let selectedDateKey = '';
    let selectedCallId = null;
    let selectedChip = 'Chip 1';

    function formatDateToKey(dateObj) {
        const year = dateObj.getFullYear();
        const month = String(dateObj.getMonth() + 1).padStart(2, '0');
        const day = String(dateObj.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
    }

    window.onload = function() {
        const todayStr = formatDateToKey(new Date());
        const dateInput = document.getElementById('dateSelect');
        dateInput.value = todayStr;
        
        escucharFecha(todayStr);
    };

    function seleccionarChip(chipName) {
        selectedChip = chipName;
        document.getElementById('chip1').classList.remove('active');
        document.getElementById('chip2').classList.remove('active');
        document.getElementById('chip3').classList.remove('active');

        if (chipName === 'Chip 1') document.getElementById('chip1').classList.add('active');
        if (chipName === 'Chip 2') document.getElementById('chip2').classList.add('active');
        if (chipName === 'Chip 3') document.getElementById('chip3').classList.add('active');
    }

    function cambiarFechaConsulta() {
        const newDate = document.getElementById('dateSelect').value;
        if (newDate) {
            escucharFecha(newDate);
        }
    }

    function escucharFecha(dateKey) {
        selectedDateKey = dateKey;

        if (currentListener) {
            currentListener.off();
        }

        currentListener = db.ref('llamadas/' + dateKey);

        currentListener.on('value', (snapshot) => {
            const data = snapshot.val();
            callsLog = [];

            if (data) {
                Object.keys(data).forEach(key => {
                    callsLog.unshift({ id: key, ...data[key] });
                });
            }

            filtrarLlamadas();
        });
    }

    function registrar(estado, claseColor) {
        const digitsInput = document.getElementById('digits');
        const digits = digitsInput.value.trim();

        if (digits.length !== 4 || isNaN(digits)) {
            alert('Por favor, ingresa únicamente los 4 dígitos numéricos.');
            digitsInput.focus();
            return;
        }

        const todayKey = formatDateToKey(new Date());

        if (selectedDateKey !== todayKey) {
            alert('Atención: Estabas consultando un día pasado. Tu nuevo registro se guardará en la fecha de HOY.');
            document.getElementById('dateSelect').value = todayKey;
            escucharFecha(todayKey);
        }

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const newCall = {
            digits: digits,
            estado: estado,
            chip: selectedChip,
            claseColor: claseColor,
            hora: timeStr,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        };

        db.ref('llamadas/' + todayKey).push(newCall);

        document.getElementById('searchInput').value = '';
        digitsInput.value = '';
        digitsInput.focus();
    }

    function renderList(list) {
        const logList = document.getElementById('logList');
        logList.innerHTML = '';

        if (list.length === 0) {
            logList.innerHTML = '<li class="empty-msg">No hay registros para la fecha seleccionada.</li>';
            document.getElementById('counter').innerText = `Total: 0`;
            return;
        }

        list.forEach(call => {
            const li = document.createElement('li');
            li.className = `log-item ${call.claseColor}`;
            const chipName = call.chip || 'Chip 1';
            li.innerHTML = `
                <div class="item-info">
                    <span class="chip-tag">${chipName}</span>
                    <span>**** - ${call.digits} | ${call.estado}</span>
                    <button class="btn-edit" onclick="abrirModal('${call.id}', '${call.digits}')" title="Editar u Opciones">✏️</button>
                </div>
                <span class="log-time">${call.hora}</span>
            `;
            logList.appendChild(li);
        });

        document.getElementById('counter').innerText = `Mostrando: ${list.length} de ${callsLog.length}`;
    }

    function filtrarLlamadas() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        
        if (query === '') {
            renderList(callsLog);
            return;
        }

        const filtered = callsLog.filter(call => 
            call.digits.includes(query) || 
            call.estado.toLowerCase().includes(query) ||
            (call.chip && call.chip.toLowerCase().includes(query))
        );

        renderList(filtered);
    }

    /* Funciones para el Modal de Edición y Borrado */
    function abrirModal(callId, digits) {
        selectedCallId = callId;
        document.getElementById('modalTitle').innerText = `Editar o eliminar **** - ${digits}`;
        document.getElementById('editModal').style.display = 'flex';
    }

    function cerrarModal() {
        selectedCallId = null;
        document.getElementById('editModal').style.display = 'none';
    }

    function confirmarEdicion(nuevoEstado, nuevaClaseColor) {
        if (!selectedCallId) return;

        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        db.ref(`llamadas/${selectedDateKey}/${selectedCallId}`).update({
            estado: nuevoEstado,
            claseColor: nuevaClaseColor,
            hora: `${timeStr} (edit)`
        });

        cerrarModal();
    }

    function eliminarRegistro() {
        if (!selectedCallId) return;

        if (confirm('¿Estás seguro de borrar este número del registro?')) {
            db.ref(`llamadas/${selectedDateKey}/${selectedCallId}`).remove();
            cerrarModal();
        }
    }
</script>

</body>
</html>
